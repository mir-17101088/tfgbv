<path class="s s-th s-mint o-50" d="M284 740 V128 H576 V740 M304 740 V148 H556 V740"/>
<path class="s s-th s-mint o-25" d="M326 172 H420 V356 H326 Z M440 172 H534 V356 H440 Z M326 382 H420 V560 H326 Z M440 382 H534 V560 H440 Z M326 586 H420 V716 H326 Z M440 586 H534 V716 H440 Z"/>
<!-- hinges -->
<path class="s s-mint o-50" d="M304 210 V236 M304 640 V666"/>
<!-- peephole -->
<circle cx="430" cy="300" r="7" fill="#061718"/><circle cx="430" cy="300" r="7" class="s s-th s-mint"/>
