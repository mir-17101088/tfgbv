<path class="s s-th o-25" d="M-700 -523 L210 100 H650 L1500 -467 M210 100 V740 M650 100 V740 M-700 1000 L210 740 H650 L1500 1080"/>
<!-- floor tiles -->
<path class="s s-th o-25" d="M300 740 L250 800 M390 740 L370 800 M480 740 L490 800 M570 740 L610 800 M150 757 H710 M70 780 H760"/>
<!-- unlit bulb -->
<path class="s s-th o-50" d="M430 0 V58"/><circle cx="430" cy="70" r="12" class="s s-th o-50"/>
<!-- switchboard, left wall -->
