<svg viewBox="110 30 640 790" role="img" aria-labelledby="il11t" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<title id="il11t">Illustration: the closed front door of her home at night, seen from inside. For years it stays shut. At the end, two shadows of feet break the light under the door and someone knocks.</title>
