<svg viewBox="0 0 1200 900" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="il01t" xmlns="http://www.w3.org/2000/svg">
<title id="il01t">Illustration: a woman, seen from behind, sits on the edge of her bed at night, lit by her phone. A clock reads 10:41 PM.</title>
<defs>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#8DD8C2" stop-opacity=".55"/>
  <stop offset=".45" stop-color="#1C7D84" stop-opacity=".18"/>
  <stop offset="1" stop-color="#0A2223" stop-opacity="0"/>
 </radialGradient>
</defs>
<rect width="1200" height="900" class="f-night"/>
<!-- window with the city -->
<g opacity=".55">
 <path class="f-night2" d="M178 118 L452 121 L449 470 L181 468 Z"/>
 <path class="s s-th" d="M178 118 L452 121 L449 470 L181 468 Z M315 120 L314 469 M180 292 L450 296"/>
 <g class="f-ocean" opacity=".7">
  <rect x="200" y="380" width="22" height="88"/><rect x="230" y="350" width="30" height="118"/><rect x="268" y="400" width="26" height="68"/>
  <rect x="330" y="360" width="34" height="108"/><rect x="372" y="390" width="20" height="78"/><rect x="398" y="330" width="40" height="138"/>
 </g>
 <g class="f-mint" opacity=".8">
  <rect x="236" y="362" width="4" height="5"/><rect x="246" y="380" width="4" height="5"/><rect x="340" y="372" width="4" height="5"/><rect x="352" y="398" width="4" height="5"/><rect x="408" y="344" width="4" height="5"/><rect x="420" y="366" width="4" height="5"/><rect x="408" y="390" width="4" height="5"/><rect x="206" y="396" width="4" height="5"/>
 </g>
 <circle cx="395" cy="175" r="18" fill="#E4F6F1" opacity=".55"/>
</g>
<!-- bed -->
<path class="f-night2" d="M60 640 C240 616 620 612 1140 630 L1140 760 L60 770 Z"/>
<path class="s s-th o-50" d="M60 640 C240 616 620 612 1140 630 M120 700 C400 690 800 688 1100 698"/>
<!-- side table + clock -->
<g transform="translate(110 0)">
<path class="f-night2" d="M930 560 L1072 560 L1068 700 L934 702 Z"/>
<path class="s s-th o-50" d="M930 560 L1072 560 L1068 700 L934 702 Z"/>
<rect x="952" y="514" width="98" height="44" rx="6" fill="#061718" stroke="#246E72" stroke-width="2"/>
<text x="1001" y="543" text-anchor="middle" class="t-m" fill="#8DD8C2" style="font-size:19px;fill:#8DD8C2">10:41</text>
</g>
<!-- glow behind her -->
<ellipse cx="950" cy="430" rx="330" ry="300" fill="url(#glow)"/>
<!-- her, from behind -->
<g transform="translate(260 0)">
 <path class="f-night" d="M528 640 C520 560 548 470 600 436 C616 426 626 418 630 400 L648 398 C652 418 662 426 680 436 C732 466 760 560 752 640 Z"/>
 <path class="f-night" d="M640 404 C606 404 590 376 592 344 C594 306 616 284 642 284 C670 284 690 308 690 344 C690 378 672 404 640 404 Z"/>
 <path class="f-night" d="M620 292 C618 266 634 252 648 254 C664 256 670 272 664 290 Z"/>
 <!-- rim light where the phone lights her -->
 <path class="s s-mint" opacity=".85" d="M676 300 C690 316 694 350 684 380 M690 440 C730 466 752 540 752 620"/>
 <path class="s s-mint o-25" d="M600 300 C590 330 592 370 604 392 M590 446 C552 480 532 552 530 620"/>
</g>
<!-- phone, held up to her right -->
<g transform="translate(260 0) rotate(-8 742 410)">
 <rect x="718" y="368" width="48" height="88" rx="8" class="f-screen"/>
 <rect x="718" y="368" width="48" height="88" rx="8" class="s s-th" stroke="#BFE6DC"/>
 <rect x="725" y="384" width="26" height="8" rx="4" fill="#9AA7A5"/><rect x="725" y="398" width="34" height="8" rx="4" fill="#9AA7A5"/><rect x="725" y="412" width="20" height="8" rx="4" fill="#9AA7A5"/>
 <g class="badge"><circle cx="766" cy="368" r="13" class="f-alarm"/><text x="766" y="373" text-anchor="middle" style="font:800 14px var(--font-display);fill:#fff" class="badge__n">1</text></g>
</g>
<!-- fingers around phone -->
<path transform="translate(260 0)" class="s s-mint o-50" d="M712 448 C708 440 712 430 720 432"/>
</svg>
