<title id="il06t">What she lived through at each step of the road: four witnesses demanded; two brought, and a sketch of her home instead of a visit; a call from DMP asking if anyone wanted money; fifty minutes waiting at the DC office; five calls from the accused's side; the legal limit passing on a March calendar; a meeting above a bakery, and news the accused is out on bail; the charge sheet, 256 days in.</title>
