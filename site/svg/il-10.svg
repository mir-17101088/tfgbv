<svg viewBox="0 0 800 800" role="img" aria-labelledby="il10t" xmlns="http://www.w3.org/2000/svg">
<title id="il10t">Illustration: on 29 November a call comes from Satkhira: the accused has been found. Then the law: under the Pornography Control Act 2012 the offence is cognizable and non-bailable (section 10), drawn as a pair of handcuffs, and section 5 measures the investigation out on a ruler: 30 working days, plus 15, plus 30, 75 working days at most.</title>
