<svg viewBox="0 0 760 1040" role="img" aria-labelledby="il03t" xmlns="http://www.w3.org/2000/svg">
<title id="il03t">Illustration: a giant pair of scales. On one pan, everything she was told to hand over piles up to the hook: the form with her name, address, age, profession, father's name, phone and National ID; the GD from Darus Salam; the GD copy; her requests for updates; the screenshots, again; the Block button; the GD officer's number. The beam tips further with every item. The other pan holds only replies that weigh nothing: No reply. No reply. She will be informed. It will be reported again.</title>
<!-- room -->
<circle cx="380" cy="560" r="500" fill="#EEF4F2"/>
<rect x="-1400" y="1000" width="3560" height="700" class="f-gray"/>
<path class="s" d="M-1400 1000 H2160"/>
<!-- date, top left -->
<text x="12" y="58" class="il03-date" style="font:800 44px var(--font-display);fill:#246E72">17 Nov</text>
<!-- dial -->
<path class="s s-th o-50" d="M302 85 A90 90 0 0 1 458 85 M325 66 L333 74 M351 50 L355 60 M380 40 V52 M409 50 L405 60 M435 66 L427 74"/>
<!-- stand -->
<rect x="368" y="130" width="24" height="830" class="f-deep"/><path class="s" d="M368 140 V960 M392 140 V960"/>
<path class="f-teal" d="M290 1000 L322 952 H438 L470 1000 Z"/><path class="s" d="M290 1000 L322 952 H438 L470 1000"/>
<!-- friends' advice (step 0) -->
<g class="il03-friends">
<path class="f-white" d="M42 836 H282 Q296 836 296 850 V880 Q296 894 282 894 H130 L104 918 L110 894 H42 Q28 894 28 880 V850 Q28 836 42 836 Z"/>
<path class="s s-th" d="M42 836 H282 Q296 836 296 850 V880 Q296 894 282 894 H130 L104 918 L110 894 H42 Q28 894 28 880 V850 Q28 836 42 836 Z"/>
<text x="162" y="873" text-anchor="middle" class="t" style="font:800 21px var(--font-display)">Cyber Crime Unit</text>
<g class="f-sage"><circle cx="80" cy="950" r="20"/><path d="M48 1000 C48 978 60 970 80 970 C100 970 112 978 112 1000 Z"/><circle cx="140" cy="942" r="21"/><path d="M106 1000 C106 972 120 962 140 962 C160 962 174 972 174 1000 Z"/><circle cx="200" cy="952" r="19"/><path d="M170 1000 C170 980 182 972 200 972 C218 972 230 980 230 1000 Z"/></g>
<path class="s s-th" d="M60 950 A20 20 0 0 1 100 950 M119 942 A21 21 0 0 1 161 942 M181 952 A19 19 0 0 1 219 952"/>
</g>
<!-- the beam (rotates) -->
<g class="il03-beam">
<path class="f-ink" d="M380 130 L372 64 L380 34 L388 64 Z"/>
<rect x="118" y="122" width="524" height="16" rx="8" class="f-deep"/><rect x="118" y="122" width="524" height="16" rx="8" class="s"/>
<circle cx="130" cy="130" r="9" class="f-white"/><circle cx="130" cy="130" r="9" class="s"/>
<circle cx="630" cy="130" r="9" class="f-white"/><circle cx="630" cy="130" r="9" class="s"/>
</g>
<circle cx="380" cy="130" r="15" class="f-ink"/><circle cx="380" cy="130" r="5" class="f-mint"/>
<!-- HER PAN: everything she is told to hand over -->
<g class="il03-pan il03-pan--l">
<path class="s s-th" d="M130 130 L-8 740 M130 130 L268 740 M130 130 V740"/>
<g transform="translate(130 740) scale(1.15) translate(-130 -740)">
<!-- 1: the form: name, address, age, profession, father's name, phone, National ID -->
<g class="c" data-k="1"><g transform="rotate(-2 130 668)">
<rect x="22" y="598" width="216" height="140" class="f-white"/><rect x="22" y="598" width="216" height="140" class="s"/>
<rect x="22" y="598" width="216" height="28" class="f-teal"/>
<text x="130" y="618" text-anchor="middle" style="font:800 15px var(--font-display);fill:#fff;letter-spacing:.06em">PCSW</text>
<g class="t" style="font-size:13px"><text x="32" y="646">Name</text><text x="32" y="668">Address</text><text x="32" y="690">Age</text><text x="32" y="712">Profession</text>
<text x="134" y="646">Father&#8217;s name</text><text x="134" y="668">Phone</text><text x="134" y="690">National ID</text></g>
<path class="s s-th o-50" d="M70 650 H124 M88 672 H124 M62 694 H124 M106 716 H124 M134 716 H226"/>
</g></g>
<!-- 2: the GD, Darus Salam -->
<g class="c" data-k="2"><g transform="translate(0 18) rotate(5 132 552)">
<rect x="44" y="494" width="176" height="114" class="f-paper"/><rect x="44" y="494" width="176" height="114" class="s"/>
<text x="132" y="532" text-anchor="middle" class="t" style="font:800 30px var(--font-display)">GD</text>
<text x="132" y="556" text-anchor="middle" class="t-m" style="font-size:15px">Darus Salam</text>
<path class="s s-th o-50" d="M60 574 H204 M60 588 H190 M60 600 H198"/>
</g></g>
