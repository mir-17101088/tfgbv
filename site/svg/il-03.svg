<g class="c" data-k="3"><g transform="translate(0 28) rotate(-4 134 462)">
<rect x="30" y="432" width="204" height="70" class="f-white"/><rect x="30" y="432" width="204" height="70" class="s"/>
<rect x="40" y="422" width="204" height="70" class="f-white"/><rect x="40" y="422" width="204" height="70" class="s"/>
<text x="62" y="452" class="t" style="font:800 17px var(--font-display)">GD copy</text>
<path class="s s-th o-50" d="M62 466 H150 M62 478 H136"/>
<path d="M196 422 V492 M164 457 H244" stroke="#246E72" stroke-width="4" fill="none"/>
<circle cx="196" cy="457" r="6" class="f-teal"/>
</g></g>
<!-- 4: ask for an update, 26 / 27 / 28 Oct -->
<g class="c" data-k="4"><g transform="translate(0 38)">
<rect x="66" y="392" width="132" height="30" rx="15" class="f-teal"/><text x="132" y="413" text-anchor="middle" style="font:700 16px var(--font-mono);fill:#fff">26 Oct</text>
<rect x="88" y="360" width="132" height="30" rx="15" class="f-teal"/><text x="154" y="381" text-anchor="middle" style="font:700 16px var(--font-mono);fill:#fff">27 Oct</text>
<rect x="52" y="328" width="132" height="30" rx="15" class="f-teal"/><text x="118" y="349" text-anchor="middle" style="font:700 16px var(--font-mono);fill:#fff">28 Oct</text>
</g></g>
<!-- 5: all the screenshots, again -->
<g class="c" data-k="5"><g transform="translate(0 52)">
<g transform="rotate(-14 54 324)"><rect x="28" y="230" width="54" height="92" rx="6" class="f-white"/><rect x="28" y="230" width="54" height="92" rx="6" class="s"/><rect x="36" y="242" width="38" height="30" fill="#9AA7A5"/><path d="M36 284 H70 M36 296 H62 M36 308 H72" stroke="#C7D0CE" stroke-width="6" stroke-linecap="round"/></g>
<g transform="rotate(-7 94 324)"><rect x="68" y="230" width="54" height="92" rx="6" class="f-white"/><rect x="68" y="230" width="54" height="92" rx="6" class="s"/><path d="M76 246 H110 M76 260 H100 M76 274 H114" stroke="#C7D0CE" stroke-width="6" stroke-linecap="round"/><rect x="76" y="286" width="38" height="26" fill="#9AA7A5"/></g>
<g><rect x="104" y="226" width="54" height="92" rx="6" class="f-white"/><rect x="104" y="226" width="54" height="92" rx="6" class="s"/><rect x="112" y="238" width="38" height="34" fill="#9AA7A5"/><path d="M112 284 H146 M112 298 H136" stroke="#C7D0CE" stroke-width="6" stroke-linecap="round"/></g>
<g transform="rotate(7 166 324)"><rect x="140" y="230" width="54" height="92" rx="6" class="f-white"/><rect x="140" y="230" width="54" height="92" rx="6" class="s"/><path d="M148 246 H182 M148 260 H170" stroke="#C7D0CE" stroke-width="6" stroke-linecap="round"/><rect x="148" y="272" width="38" height="38" fill="#9AA7A5"/></g>
<g transform="rotate(14 206 324)"><rect x="178" y="230" width="54" height="92" rx="6" class="f-white"/><rect x="178" y="230" width="54" height="92" rx="6" class="s"/><rect x="186" y="242" width="38" height="30" fill="#9AA7A5"/><path d="M186 284 H220 M186 298 H208" stroke="#C7D0CE" stroke-width="6" stroke-linecap="round"/></g>
</g></g>
<!-- 6: block him -->
<g class="c" data-k="6"><g transform="translate(0 62) rotate(-3 130 206)">
<rect x="50" y="184" width="160" height="42" rx="10" class="f-alarm"/>
<text x="130" y="213" text-anchor="middle" style="font:800 21px var(--font-display);fill:#fff;letter-spacing:.08em">BLOCK</text>
</g></g>
<!-- 7: the GD officer's number -->
<g class="c" data-k="7"><g transform="translate(0 70) rotate(4 130 160)">
<rect x="40" y="142" width="180" height="38" class="f-white"/><rect x="40" y="142" width="180" height="38" class="s"/>
<g class="f-ink"><circle cx="70" cy="161" r="4.5"/><circle cx="90" cy="161" r="4.5"/><circle cx="110" cy="161" r="4.5"/><circle cx="130" cy="161" r="4.5"/><circle cx="150" cy="161" r="4.5"/><circle cx="170" cy="161" r="4.5"/><circle cx="190" cy="161" r="4.5"/></g>
</g></g>
<path class="f-teal" d="M10 740 H250 Q244 792 130 794 Q16 792 10 740 Z"/><path class="s" d="M10 740 H250 Q244 792 130 794 Q16 792 10 740 Z"/>
</g></g>
<!-- THEIR PAN: what comes back -->
<g class="il03-pan il03-pan--r">
<path class="s s-th" d="M630 130 L492 740 M630 130 L768 740 M630 130 V740"/>
<g transform="translate(630 740) scale(1.15) translate(-630 -740)">
<g class="c" data-k="4">
<rect x="514" y="700" width="112" height="34" rx="17" class="f-white"/><rect x="514" y="700" width="112" height="34" rx="17" class="s s-th s-dash" style="color:#5C6B6A"/>
<text x="570" y="723" text-anchor="middle" style="font:700 16px var(--font-body);fill:#5C6B6A">No reply.</text>
<rect x="634" y="700" width="112" height="34" rx="17" class="f-white"/><rect x="634" y="700" width="112" height="34" rx="17" class="s s-th s-dash" style="color:#5C6B6A"/>
<text x="690" y="723" text-anchor="middle" style="font:700 16px var(--font-body);fill:#5C6B6A">No reply.</text>
<rect x="520" y="634" width="224" height="58" rx="12" class="f-gray"/><rect x="520" y="634" width="224" height="58" rx="12" class="s s-th"/>
<text x="534" y="658" class="t" style="font-size:15px">She will be informed;</text><text x="534" y="680" class="t" style="font-size:15px">fact-finding takes time.</text>
</g>
<g class="c" data-k="5">
<rect x="530" y="572" width="200" height="56" rx="12" class="f-gray"/><rect x="530" y="572" width="200" height="56" rx="12" class="s s-th"/>
<text x="544" y="596" class="t" style="font-size:15px">&#8220;It will be reported</text><text x="544" y="618" class="t" style="font-size:15px">again.&#8221;</text>
</g>
<path class="f-teal" d="M510 740 H750 Q744 792 630 794 Q516 792 510 740 Z"/><path class="s" d="M510 740 H750 Q744 792 630 794 Q516 792 510 740 Z"/>
</g></g>
